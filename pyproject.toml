[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ocrlab-mcp"
version = "0.1.0"
description = "An MCP server that reads scanned documents: a PDF page's text layer when it has one, Tesseract OCR when it has not, every word with its box on the page and its confidence."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Khoa Hoang" }]
requires-python = ">=3.10"
keywords = ["mcp", "ocr", "tesseract", "pdf", "scans", "documents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = ["mcp>=2.0,<3", "pymupdf>=1.24"]

[project.urls]
Homepage = "https://github.com/hpdkhoa/ocrlab-mcp"
Issues = "https://github.com/hpdkhoa/ocrlab-mcp/issues"

[project.scripts]
ocrlab-mcp = "ocrlab.server:main"
ocrlab = "ocrlab.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ocrlab"]
